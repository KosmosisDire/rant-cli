# Builds rant on every platform. Run by hand on main it builds main, and when VERSION has no
# tag yet it also releases it: a GitHub Release with the binaries and the skill attached.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<VERSION> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux,   name: linux-x64 }
          - { os: windows-latest, preset: windows, name: win-x64 }
          - { os: macos-15,       preset: macos,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # The end to end tests need a Rant mesh, which a runner's network may not carry.
      - name: Unit tests
        timeout-minutes: 10
        run: ctest --preset ${{ matrix.preset }} -R "^(unit|config)[.]"

      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          ext=""
          if [ -f bin/rant.exe ]; then ext=".exe"; fi
          cp "bin/rant$ext" "out/rant-$(cat VERSION)-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: rant-${{ matrix.name }}
          path: out/*

  # The release makes the tag v<VERSION> on this commit, once every build above passed
  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the error body on a miss, so only a found tag is compared
          if at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null)"; then
            test "$at" = "$GITHUB_SHA"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: source

      # the package rant carries its skill folder, the files at the zip's top
      - name: Skill
        working-directory: source/skill
        run: zip -r "$GITHUB_WORKSPACE/release/rant-${{ needs.plan.outputs.version }}-skill.zip" .

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
