# Builds rant on every platform. Run by hand on main it builds main, and when the version has
# no tag yet it also releases it: a GitHub Release with the binaries and the skill attached.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<version> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # static, so it runs on any Linux whatever its libc
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, name: linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: win-x64 }
          - { os: macos-15,       target: aarch64-apple-darwin,      name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: musl
        if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools

      - name: Lint
        run: cargo clippy --locked --release --target ${{ matrix.target }} --workspace --all-targets -- -D warnings

      # The end to end tests need a Rant mesh, which a runner's network may not carry.
      - name: Unit tests
        timeout-minutes: 10
        run: |
          cargo test --locked --release --target ${{ matrix.target }} -p rant-config -p rant-process
          cargo test --locked --release --target ${{ matrix.target }} -p rant-cli --bin rant

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin rant

      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/rant$ext" "out/rant-${{ needs.plan.outputs.version }}-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: rant-${{ matrix.name }}
          path: out/*

  # The release makes the tag v<version> on this commit, once every build above passed
  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the error body on a miss, so only a found tag is compared
          if at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null)"; then
            test "$at" = "$GITHUB_SHA"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: source

      # the package rant carries its skill folder, the files at the zip's top
      - name: Skill
        working-directory: source/skill
        run: zip -r "$GITHUB_WORKSPACE/release/rant_skill-${{ needs.plan.outputs.version }}-skill.zip" .

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
