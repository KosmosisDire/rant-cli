# config/ is the crate of the C++ build, which leaves with it. The C++ tests build Cargo
# packages under build/.
[workspace]
members = ["crates/cli", "crates/config"]
exclude = ["config", "build"]
resolver = "3"

[workspace.package]
version = "0.0.36"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
regex = "1.13.1"
serde_json = "1.0.151"
