language = "C"
include_guard = "RANT_CONFIG_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from config/src/ffi.rs. Do not edit. */"
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
include = ["RantConfigWorkspaceView", "RantConfigPlanView", "RantConfigGroupView", "RantConfigBuildView", "RantConfigDiagnostic"]
