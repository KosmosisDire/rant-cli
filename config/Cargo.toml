[package]
name = "rant-config"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rant_config"
crate-type = ["staticlib", "rlib"]

[dependencies]
globset = "0.4.20"
goblin = "0.10.7"
hcl-edit = "0.9"
hcl-rs = "0.19"
ignore = "0.4.33"
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"
ureq = "3"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

# A panic must never unwind into the C++ caller.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
