[package]
name = "rant-cli"
description = "rant, the command line tool of Rant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rant"
path = "src/main.rs"

# Programs the end to end tests run as nodes. A release builds only rant.
[[bin]]
name = "test_node"
path = "tests/nodes/test_node.rs"
test = false
doc = false

[[bin]]
name = "test_window"
path = "tests/nodes/test_window.rs"
test = false
doc = false

[dependencies]
rant-middleware = { git = "https://github.com/KosmosisDire/Rant.git", tag = "crate-v0.0.41" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
regex.workspace = true
serde_json.workspace = true
