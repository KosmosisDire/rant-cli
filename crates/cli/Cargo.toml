[package]
name = "rant-cli"
description = "rant, the command line tool of Rant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rant"
path = "src/main.rs"

# Programs the end to end tests run as nodes. A release builds only rant.
[[bin]]
name = "test_node"
path = "tests/nodes/test_node.rs"
test = false
doc = false

[[bin]]
name = "test_window"
path = "tests/nodes/test_window.rs"
test = false
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rant-config = { path = "../config" }
rant-process = { path = "../process" }
# Rant beside this checkout until its release after the rewrite, which this pins as a tag again
rant-middleware = { path = "../../../rant/bindings/rust/rant" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
miniz_oxide = "0.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
